{% extends "usuarios/base.html" %}

{% block title %}Mi perfil | Flores Cali{% endblock %}

{% block content %}
    <span class="eyebrow">Mi espacio</span>
    <h1 class="page-heading">Mi perfil</h1>
    <section class="panel" style="padding: 24px">
        <dl>
            <dt>Nombre</dt>
            <dd>{{ usuario.nombre }}</dd>
            <dt>Correo electrónico</dt>
            <dd>{{ usuario.correo }}</dd>
        </dl>
        <p class="help-text">Para actualizar tus datos, contacta con la administración.</p>
    </section>
{% endblock %}
