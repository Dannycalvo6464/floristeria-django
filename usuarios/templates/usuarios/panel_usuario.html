<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Usuario</title>
    <style>
        :root {
            --bg: #f7ebf0;
            --card: rgba(255,255,255,0.78);
            --pink: #c56d86;
            --pink-deep: #9d3d61;
            --text: #3a2e31;
            --muted: #7d636a;
            --line: rgba(169, 111, 132, 0.5);
            --shadow: rgba(150, 94, 118, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #f6ebf0 0%, #f5f0f2 100%);
            color: var(--text);
            padding: 28px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(92%, 900px);
            margin: 0 auto;
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 18px 38px var(--shadow);
            padding: 28px 30px 32px;
            border: 1px solid rgba(170, 122, 138, 0.08);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            border-bottom: 1px solid rgba(157, 61, 97, 0.12);
            padding-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-weight: 900;
            letter-spacing: -0.06em;
            font-size: clamp(2.2rem, 3vw, 4rem);
            color: var(--pink-deep);
        }

        .brand {
            margin-top: 6px;
            font-size: 0.9rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--pink-deep);
            font-weight: 800;
        }

        .badge {
            background: #f7dfe7;
            color: var(--pink-deep);
            border-radius: 999px;
            padding: 10px 18px;
            font-weight: 800;
            font-size: 1rem;
            min-width: 110px;
            text-align: center;
        }

        .logout {
            display: inline-block;
            margin-top: 18px;
            background: linear-gradient(135deg, #c26a84, #9f3d61);
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 800;
            box-shadow: 0 12px 22px rgba(160, 83, 112, 0.2);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 26px;
        }

        .card {
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(157, 61, 97, 0.12);
            border-radius: 18px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        .card a {
            text-decoration: none;
            color: var(--text);
            font-weight: 800;
            font-size: clamp(1.2rem, 2vw, 2rem);
            letter-spacing: -0.04em;
        }

        @media (max-width: 780px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h1>Bienvenido {{ usuario.nombre }}</h1>
                <div class="brand">Flores Cali</div>
            </div>
            <div class="badge">{{ usuario.tipo }}</div>
        </div>

        <a class="logout" href="/logout/">Cerrar sesión</a>

        <div class="nav-grid">
            <div class="card"><a href="/catalogo/">Ver catálogo</a></div>
            <div class="card"><a href="/mis_pedidos/">Mis pedidos</a></div>
            <div class="card"><a href="/mi_perfil/">Mi perfil</a></div>
        </div>
    </div>
</body>
</html>
